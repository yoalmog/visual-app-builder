name: CI - Build Software for Windows & Verify Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-tests:
    name: Verify Platform (Typecheck, Lint & 901 Acceptance Tests)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Verification (tsc --noEmit)
        run: npx.cmd tsc --noEmit

      - name: Run ESLint Verification
        run: npm.cmd run lint

      - name: Execute Complete Master Acceptance Suite (901/901 Tests)
        run: npx.cmd tsx scripts/run-all-acceptance-tests.ts

  build-software:
    name: Build Software for Windows (Desktop .exe & Standalone Package)
    runs-on: windows-latest
    needs: verify-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Software
        run: npm.cmd run build
        env:
          NODE_ENV: production

      - name: Prepare Standalone Assets and Windows Launchers
        run: |
          # Copy static and public assets into standalone directory for self-contained runtime
          if (Test-Path ".next\static") {
            New-Item -ItemType Directory -Force -Path ".next\standalone\.next\static"
            Copy-Item -Recurse -Force ".next\static\*" ".next\standalone\.next\static\"
          }
          if (Test-Path "public") {
            Copy-Item -Recurse -Force "public" ".next\standalone\"
          }
          Copy-Item -Force "Launch-Visual-App-Builder.bat" ".next\standalone\"
          Copy-Item -Force "Launch-Silent.vbs" ".next\standalone\"

      - name: Build Windows Desktop Executables (.exe Installer & Portable)
        run: npx.cmd electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows Standalone Distribution (Zip)
        run: |
          Compress-Archive -Path ".next\standalone\*" -DestinationPath "visual-app-builder-windows-standalone.zip" -Force

      - name: Upload Windows Desktop Software (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: visual-app-builder-windows-desktop-exe
          path: |
            dist/*.exe
            dist/*.blockmap
          retention-days: 30

      - name: Upload Windows Standalone Software (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: visual-app-builder-windows-standalone-zip
          path: visual-app-builder-windows-standalone.zip
          retention-days: 30

version: '3.8'

services:
  # 1. PostgreSQL Primary Database
  postgres-primary:
    image: postgres:16-alpine
    container_name: apex-postgres-primary
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apexpassword123
      POSTGRES_DB: apex_primary
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c max_replication_slots=10
               -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_primary"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PostgreSQL Read Replica
  postgres-replica:
    image: postgres:16-alpine
    container_name: apex-postgres-replica
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      PGUSER: apex
      PGPASSWORD: apexpassword123
    ports:
      - "5433:5432"
    command: >
      sh -c '
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h postgres-primary -p 5432 -U apex -D /var/lib/postgresql/data -Fp -Xs -R
        postgres -c hot_standby=on
      '

  # 3. Redis Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: apex-redis-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 4. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: apex-minio-s3
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Helper to create default bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 minioadmin minioadminpassword;
      mc mb --ignore-existing localminio/apex-backups;
      exit 0;
      "
